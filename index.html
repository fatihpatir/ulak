<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULAK</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <button id="info-btn" class="glass-btn icon-btn top-right-btn"><i class="ri-information-line"></i></button>

    <div id="auth-view" class="view active-view">
        <div class="auth-container">
            <div class="logo-area">
                <div class="main-logo"><i class="ri-meteor-line"></i></div>
                <h1 class="app-title">ULAK</h1>
            </div>
            <button id="google-login-btn" class="google-btn">Google ile Giriş Yap</button>
        </div>
    </div>

    <div id="app-view" class="view">
        <header class="app-header">
            <h2>Sohbetler</h2>
            <img id="user-avatar" class="avatar-sm hide" src="">
        </header>
        <ul id="chat-list" class="chat-list"></ul>
        <button id="new-chat-fab" class="fab-btn"><i class="ri-add-line"></i></button>
    </div>

    <div id="chat-detail-view" class="view">
        <header class="chat-header">
            <button id="back-to-chats-btn" class="icon-btn"><i class="ri-arrow-left-s-line"></i></button>
            <div class="chat-header-info">
                <h3 id="chat-header-name">Yükleniyor...</h3>
            </div>
            <button id="start-call-btn" class="icon-btn"><i class="ri-vidicon-line"></i></button>
        </header>
        <div id="chat-messages" class="chat-messages-container"></div>
        
        <div id="recording-indicator" class="recording-bar hide">Kayıt yapılıyor...</div>
        
        <div class="chat-input-area">
            <button id="mic-btn" class="icon-btn"><i class="ri-mic-fill"></i></button>
            <input type="text" id="message-input" placeholder="Mesajınızı yazın...">
            <button id="send-btn" class="icon-btn"><i class="ri-send-plane-fill"></i></button>
        </div>
    </div>

    <div id="info-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <h3>Sistem Bilgisi</h3>
            <p>Geliştirici: <b>Fatih PATIR</b></p>
            <button class="close-modal-btn">Kapat</button>
        </div>
    </div>

    <div id="new-chat-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <h3>Yeni Sohbet</h3>
            <input type="email" id="new-chat-email" placeholder="E-posta adresi...">
            <button id="start-chat-btn">Başlat</button>
            <button class="close-modal-btn">İptal</button>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
